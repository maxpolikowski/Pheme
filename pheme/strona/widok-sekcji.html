<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pheme - Widok Sekcji</title>
    <style>
        :root {
            --primary-green: #00ce52;
            --bg-gray: #f5f5f5;
            --dark-gray: #333333;
            --red-header: #ff3b3b;
            --blue-feedback: #007bff;
            --orange-edit: #ff9800;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            background: linear-gradient(to right, #ffffff, var(--red-header));
            text-align: center;
            padding: 15px 0;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            width: 95%;
            max-width: 800px;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--red-header);
            border-bottom: 3px solid var(--red-header);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .note-item, .feedback-item, .question-item {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .fb-badge-new {
            background: red;
            color: white;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .lesson-accordion {
            background: #eee;
            padding: 10px;
            margin-top: 5px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            border-radius: 5px;
        }

        .missing-students {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        textarea {
            width: 100%;
            height: 60px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 5px;
        }

        .btn-send-fb {
            margin-top: 10px;
            padding: 8px 15px;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .user-row {
            padding: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="header-bar">
    <span id="section-title">Ładowanie sekcji...</span>
</div>

<div class="container">
    <div id="section-code-badge" style="display:none; text-align:center; margin-bottom:15px;">
        Kod sekcji: <strong id="display-kod">---</strong>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'notatki')">Notatki</button>
        <button class="tab-btn" onclick="openTab(event, 'pytania')">Wiadomości</button>
        <button class="tab-btn" onclick="openTab(event, 'feedback')">Feedback</button>
        <button class="tab-btn" onclick="openTab(event, 'lista-czlonkow')">Członkowie</button>
    </div>

    <!-- NOTATKI -->
    <div id="notatki" class="tab-content active">
        <button id="btn-pokaz-form-notatki" style="display:none; margin-bottom:15px;" onclick="document.getElementById('form-dodaj-notatke').style.display='block'">+ Dodaj lekcję</button>
        
        <div id="form-dodaj-notatke" style="display:none; background:#f9f9f9; padding:15px; border-radius:8px; margin-bottom:20px;">
            <input type="text" id="note-lesson-name" placeholder="Nazwa lekcji (np. Lekcja 1)" style="width:90%; margin-bottom:10px;"><br>
            <input type="text" id="note-link1" placeholder="Link do notatek" style="width:90%; margin-bottom:10px;"><br>
            <input type="text" id="note-link2" placeholder="Opcjonalny drugi link" style="width:90%; margin-bottom:10px;"><br>
            <button onclick="dodajNotatke()">Zapisz</button>
            <button onclick="document.getElementById('form-dodaj-notatke').style.display='none'">Anuluj</button>
        </div>

        <div id="lista-notatek">Pobieranie...</div>
    </div>

    <!-- PYTANIA / WIADOMOŚCI -->
    <div id="pytania" class="tab-content">
        <div id="form-zadaj-pytanie" style="margin-bottom:20px;">
            <textarea id="question-text" placeholder="Zadaj pytanie nauczycielowi..."></textarea>
            <button onclick="zadajPytanie()" style="background:var(--primary-green); color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">Wyślij wiadomość</button>
        </div>
        <div id="lista-pytan">Pobieranie wiadomości...</div>
    </div>

    <!-- FEEDBACK -->
    <div id="feedback" class="tab-content">
        <div id="feedback-container">Pobieranie opinii...</div>
    </div>

    <!-- CZŁONKOWIE -->
    <div id="lista-czlonkow" class="tab-content">
        <h3>Nauczyciele</h3>
        <div id="admins-list"></div>
        <h3 style="margin-top:20px;">Uczniowie</h3>
        <div id="users-list"></div>
    </div>
</div>

<script>
    const API_URL = "https://pheme-far9.onrender.com";
    const token = localStorage.getItem("token");
    const params = new URLSearchParams(window.location.search);
    const kod = params.get('kod');

    let currentUser = null;
    let currentSection = null;

    async function inicjalizuj() {
        if (!token) return window.location.href = "index.html";
        try {
            const profRes = await fetch(`${API_URL}/profil`, { headers: { "Authorization": "Bearer " + token } });
            currentUser = await profRes.json();

            const res = await fetch(`${API_URL}/moje-sekcje`, { headers: { "Authorization": "Bearer " + token } });
            const sekcje = await res.json(); 
            currentSection = sekcje.find(s => s.kod === kod);

            if (currentSection) {
                document.getElementById('section-title').innerText = currentSection.name;
                const maUprawnieniaNauczyciela = currentSection.rola === "nauczyciel" || currentUser.role === "polska_sigma"; 
                
                if (maUprawnieniaNauczyciela) {
                    document.getElementById('section-code-badge').style.display = 'block';
                    document.getElementById('display-kod').innerText = kod;
                    document.getElementById('btn-pokaz-form-notatki').style.display = 'block';
                }

                pobierzNotatki(maUprawnieniaNauczyciela);
            } else {
                alert("Brak dostępu!");
                window.location.href = "sekcje.html";
            }
        } catch (e) { console.error(e); }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');

        const maNauczyciela = currentSection.rola === "nauczyciel" || currentUser.role === "polska_sigma";
        if (tabName === 'pytania') przygotujPytania();
        if (tabName === 'lista-czlonkow') pobierzCzlonkow();
        if (tabName === 'notatki') pobierzNotatki(maNauczyciela);
        if (tabName === 'feedback') przygotujFeedback(maNauczyciela);
    }

    async function pobierzNotatki(czyNauczyciel) {
        try {
            const res = await fetch(`${API_URL}/section-notes/${kod}`, { headers: { "Authorization": "Bearer " + token } });
            const notes = await res.json();
            const container = document.getElementById('lista-notatek');
            container.innerHTML = notes.length ? [...notes].reverse().map(n => `
                <div class="note-item">
                    <div style="display:flex; justify-content:space-between;">
                        <strong>${n.lessonName}</strong>
                        ${czyNauczyciel ? `<button onclick="usunNotatke('${n.id}')" style="color:red; cursor:pointer;">Usuń</button>` : ''}
                    </div>
                    <a href="${n.link1}" target="_blank">Link 1</a> ${n.link2 ? `| <a href="${n.link2}" target="_blank">Link 2</a>` : ''}
                </div>
            `).join('') : "<p>Brak notatek.</p>";
        } catch (e) { console.error(e); }
    }

    async function dodajNotatke() {
        const lessonName = document.getElementById('note-lesson-name').value;
        const link1 = document.getElementById('note-link1').value;
        const link2 = document.getElementById('note-link2').value;
        const maNauczyciela = currentSection.rola === "nauczyciel" || currentUser.role === "polska_sigma";
        
        await fetch(`${API_URL}/add-note`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ code: kod, lessonName, link1, link2 })
        });
        document.getElementById('form-dodaj-notatke').style.display='none';
        pobierzNotatki(maNauczyciela);
    }

    async function usunNotatke(id) {
        if(!confirm("Usunąć?")) return;
        const maNauczyciela = currentSection.rola === "nauczyciel" || currentUser.role === "polska_sigma";
        await fetch(`${API_URL}/delete-note`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ code: kod, noteId: id })
        });
        pobierzNotatki(maNauczyciela);
    }

    async function przygotujPytania() {
        const res = await fetch(`${API_URL}/section-questions/${kod}`, { headers: { "Authorization": "Bearer " + token } });
        const questions = await res.json();
        const container = document.getElementById('lista-pytan');
        const maNauczyciela = currentSection.rola === "nauczyciel" || currentUser.role === "polska_sigma";

        const storageKey = `seen_${currentUser.username}_${kod}`;
        let seenData = JSON.parse(localStorage.getItem(storageKey) || "{}");

        container.innerHTML = questions.reverse().map(q => {
            const isAuthor = q.username === currentUser.username;
            if (!maNauczyciela && !isAuthor) return "";

            const msgCount = (q.replies || []).length + 1;
            const isNew = msgCount > (seenData[q.id] || 0);

            return `
                <div class="question-item" style="border-left: 4px solid ${isAuthor ? 'var(--blue-feedback)' : 'var(--red-header)'};" onclick="oznaczWiadomosci('${q.id}', ${msgCount})">
                    <small>${q.author || q.username} ${isNew ? '<span class="fb-badge-new">NOWE</span>' : ''}</small>
                    <p>${q.text}</p>
                    ${(q.replies || []).map(r => `<div style="margin-left:20px; font-size:0.9rem; border-top:1px solid #eee;"><strong>${r.author}:</strong> ${r.text}</div>`).join('')}
                    <div style="margin-top:10px;">
                        <textarea id="reply-${q.id}" placeholder="Odpowiedz..."></textarea>
                        <button onclick="wyslijOdpowiedz('${q.id}')">Odślij</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function zadajPytanie() {
        const text = document.getElementById('question-text').value;
        await fetch(`${API_URL}/ask-question`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ code: kod, text })
        });
        document.getElementById('question-text').value = "";
        przygotujPytania();
    }

    async function wyslijOdpowiedz(qId) {
        const text = document.getElementById(`reply-${qId}`).value;
        await fetch(`${API_URL}/reply-question`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ code: kod, questionId: qId, text })
        });
        przygotujPytania();
    }

    function oznaczWiadomosci(qId, count) {
        const key = `seen_${currentUser.username}_${kod}`;
        let data = JSON.parse(localStorage.getItem(key) || "{}");
        data[qId] = count;
        localStorage.setItem(key, JSON.stringify(data));
        przygotujPytania();
    }

    async function przygotujFeedback(czyNauczyciel) {
        const container = document.getElementById('feedback-container');
        const notesRes = await fetch(`${API_URL}/section-notes/${kod}`, { headers: { "Authorization": "Bearer " + token } });
        const notes = await notesRes.json();
        const fbRes = await fetch(`${API_URL}/section-feedback/${kod}`, { headers: { "Authorization": "Bearer " + token } });
        const feedbacks = await fbRes.json();

        if (czyNauczyciel) {
            const memRes = await fetch(`${API_URL}/section-members/${kod}`, { headers: { "Authorization": "Bearer " + token } });
            const members = await memRes.json();
            const students = members.filter(m => m.role !== "nauczyciel");
            const storageKey = `seen_fb_${currentUser.username}_${kod}`;
            let seenData = JSON.parse(localStorage.getItem(storageKey) || "{}");

            container.innerHTML = [...notes].reverse().map(n => {
                const lessonFbs = feedbacks.filter(f => f.lessonName === n.lessonName);
                const isNew = lessonFbs.length > (seenData[n.lessonName] || 0);
                const safeId = "fb-" + n.id;
                return `
                    <div class="lesson-accordion" onclick="toggleFb('${safeId}', '${n.lessonName}', ${lessonFbs.length})">
                        <span>${n.lessonName} ${isNew ? '<span class="fb-badge-new">NOWE</span>' : ''}</span>
                        <span>▼</span>
                    </div>
                    <div id="${safeId}" style="display:none; padding:10px; background:#fff;">
                        ${lessonFbs.map(f => `<div class="feedback-item"><strong>${f.author}:</strong> ${f.message}</div>`).join('') || "Brak opinii"}
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = [...notes].reverse().map(n => {
                const moj = feedbacks.find(f => f.lessonName === n.lessonName && f.username === currentUser.username);
                return `
                    <div class="feedback-item">
                        <strong>${n.lessonName}</strong>
                        <textarea id="my-fb-${n.id}">${moj ? moj.message : ""}</textarea>
                        <button onclick="wyslijFeedback('${n.lessonName}', 'my-fb-${n.id}')">${moj ? 'Aktualizuj' : 'Wyślij'}</button>
                    </div>
                `;
            }).join('');
        }
    }

    async function wyslijFeedback(lessonName, inputId) {
        const message = document.getElementById(inputId).value;
        await fetch(`${API_URL}/send-feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ code: kod, lessonName, message })
        });
        alert("Wysłano!");
    }

    function toggleFb(id, name, count) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
        const key = `seen_fb_${currentUser.username}_${kod}`;
        let data = JSON.parse(localStorage.getItem(key) || "{}");
        data[name] = count;
        localStorage.setItem(key, JSON.stringify(data));
    }

    async function pobierzCzlonkow() {
        const res = await fetch(`${API_URL}/section-members/${kod}`, { headers: { "Authorization": "Bearer " + token } });
        const members = await res.json();
        const aL = document.getElementById('admins-list');
        const uL = document.getElementById('users-list');
        aL.innerHTML = ""; uL.innerHTML = "";
        
        const mozeZarzadzac = currentUser.role === "polska_sigma" || currentSection.rola === "nauczyciel";

        members.forEach(m => {
            const html = `<div class="user-row">${m.name || m.username} ${mozeZarzadzac && m.username !== currentUser.username ? `<button onclick="usunZSekcji('${m.username}')">Usuń</button>` : ''}</div>`;
            if(m.role === 'nauczyciel') aL.innerHTML += html;
            else uL.innerHTML += html;
        });
    }

    async function usunZSekcji(target) {
        if(!confirm("Usunąć użytkownika?")) return;
        await fetch(`${API_URL}/remove-from-section`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
            body: JSON.stringify({ code: kod, targetUsername: target })
        });
        pobierzCzlonkow();
    }

    window.onload = inicjalizuj;
</script>
</body>
</html>
