<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pheme - Panel Sigmy </title>
    <style>
        :root {
            --primary-green: #00ce52;
            --bg-gray: #f5f5f5;
            --dark-gray: #333333;
            --red-header: #ff3b3b;
            --gold-boga: #ffaa00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            background: linear-gradient(to right, #ffd700, var(--gold-boga));
            color: #000;
            text-align: center;
            padding: 15px 0;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin-top: 30px;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .tab-btn.active { background: var(--gold-boga); color: #000; }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            min-height: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .item-box {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--gold-boga);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .god-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
        }

        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button.god-action {
            background: var(--dark-gray);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button.god-action:hover { background: var(--gold-boga); color: black; }
        
        .badge {
            background: #ddd;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .back-link { margin-top: 20px; display: block; color: #888; text-decoration: none; text-align: center; }
    </style>
</head>
<body>

<div class="header-bar">Panel Boga</div>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'sekcje')">Wszystkie Sekcje</button>
        <button class="tab-btn" onclick="openTab(event, 'uzytkownicy')">Użytkownicy</button>
        <button class="tab-btn" onclick="openTab(event, 'pytania')">Pytania / Konwersacje</button>
        <button class="tab-btn" onclick="openTab(event, 'feedback')">Ostatnie Feedbacki</button>
    </div>

    <div class="content-card">
        <div id="sekcje" class="tab-content active">
            <h2>Zarządzanie Sekcjami</h2>
            <div id="sekcje-list">Ładowanie...</div>
        </div>

        <div id="uzytkownicy" class="tab-content">
            <h2>Wszyscy Zarejestrowani Użytkownicy</h2>
            <div id="users-list">Ładowanie...</div>
        </div>

        <div id="pytania" class="tab-content">
            <h2>Globalny podgląd konwersacji</h2>
            <div id="questions-list">Ładowanie...</div>
        </div>

        <div id="feedback" class="tab-content">
            <h2>Globalny podgląd opinii</h2>
            <div id="feedbacks-list">Ładowanie...</div>
        </div>
    </div>

    <a href="start.html" class="back-link">← Powrót do normalności (Kondescendencja) </a>
</div>

<script>
    const API_URL = "https://pheme-far9.onrender.com";
    const token = localStorage.getItem("token");

    // Zmienna przechowująca login aktualnie zalogowanej osoby
    let currentUsername = "";

    if (!token) window.location.href = "index.html";

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    async function fetchData(endpoint) {
        const res = await fetch(`${API_URL}/god/${endpoint}`, {
            headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) {
            if (res.status === 403) alert("Brak uprawnień boskich!");
            return null;
        }
        return await res.json();
    }

    async function loadAll() {
        // Pobieramy tożsamość zalogowanego użytkownika, jeśli jeszcze jej nie znamy
        if (!currentUsername) {
            try {
                const profileRes = await fetch(`${API_URL}/profil`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                if (profileRes.ok) {
                    const profileData = await profileRes.json();
                    currentUsername = profileData.username;
                }
            } catch (e) {
                console.error("Nie udało się pobrać tożsamości profilu", e);
            }
        }

        const users = await fetchData("all-users");
        const sections = await fetchData("all-sections");
        const questions = await fetchData("all-questions");
        const feedbacks = await fetchData("all-feedbacks");

        if(users) renderUsers(users);
        if(sections) renderSections(sections);
        if(questions) renderQuestions(questions);
        if(feedbacks) renderFeedbacks(feedbacks);
    }

    function renderUsers(users) {
        document.getElementById("users-list").innerHTML = users.map(u => `
            <div class="item-box" style="display:flex; justify-content:space-between; align-items:center;">
                <span><strong>${u.username}</strong> (${u.name || 'Brak imienia'})</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="badge" style="background:${u.role === 'polska_sigma' ? '#ffaa00' : (u.role === 'admin' ? '#ff3b3b' : '#eee')}; color:${u.role !== 'user' ? '#fff' : '#333'}">${u.role}</span>
                    
                    ${u.role !== 'polska_sigma' ? `
                        <button class="god-action" style="padding: 4px 10px; font-size: 0.8rem;" onclick="promoteUser('${u.username}')">Awansuj ↑</button>
                    ` : ''}

                    ${currentUsername === "pomaksik" && u.username !== "pomaksik" && u.role !== "user" ? `
                        <button class="god-action" style="padding: 4px 10px; font-size: 0.8rem; background: ##ff00cc;" onclick="demoteUser('${u.username}')">Degraduj ↓</button>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    function renderSections(sections) {
        document.getElementById("sekcje-list").innerHTML = sections.map(s => `
            <div class="item-box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0">${s.name} <span class="badge">Kod: ${s.code}</span></h3>
                    <small>Założyciel: ${s.creator}</small>
                </div>
                <div style="margin-top:10px; font-size: 0.9rem;">
                    <strong>Członkowie (${s.members.length}):</strong> 
                    ${s.members.map(m => `${m.username} <small>(${m.role})</small>`).join(', ')}
                </div>
                <div class="god-form">
                    <strong>Wymuś dodanie:</strong>
                    <input type="text" id="add-user-${s.code}" placeholder="Login (username)">
                    <select id="add-role-${s.code}">
                        <option value="user">Uczeń</option>
                        <option value="nauczyciel">Nauczyciel</option>
                    </select>
                    <button class="god-action" onclick="forceAddMember('${s.code}')">Dodaj</button>
                </div>
            </div>
        `).join('');
    }

    function renderQuestions(questions) {
        document.getElementById("questions-list").innerHTML = questions.map(q => `
            <div class="item-box" style="border-left-color: purple;">
                <div style="display:flex; justify-content:space-between;">
                    <span class="badge">${q.sectionName}</span>
                    <small>${q.date}</small>
                </div>
                <h4 style="margin: 10px 0 5px 0;">Temat: ${q.subject}</h4>
                <div style="font-size:0.9rem; margin-bottom: 5px;">
                    <strong>Od:</strong> ${q.from} | <strong>Do:</strong> ${q.to.join(', ')}
                </div>
                <p style="margin:0; background:white; padding:10px; border-radius:5px;">${q.text}</p>
                <small style="color:#888;">Odpowiedzi: ${q.replies ? q.replies.length : 0}</small>
            </div>
        `).join('');
    }

    function renderFeedbacks(feedbacks) {
        document.getElementById("feedbacks-list").innerHTML = feedbacks.map(f => `
            <div class="item-box" style="border-left-color: #007bff;">
                <div style="display:flex; justify-content:space-between;">
                    <span class="badge">${f.sectionName} - ${f.lessonName}</span>
                    <small>${f.date}</small>
                </div>
                <div style="margin-top: 10px; font-size:0.9rem;">
                    <strong>Autor:</strong> ${f.author || f.username} ${f.edited ? '<small style="color:#ff9800">(edytowano)</small>' : ''}
                </div>
                <p style="margin:5px 0 0 0; background:white; padding:10px; border-radius:5px; white-space:pre-wrap;">${f.message}</p>
            </div>
        `).join('');
    }

    async function forceAddMember(code) {
        const username = document.getElementById(`add-user-${code}`).value.trim();
        const role = document.getElementById(`add-role-${code}`).value;

        if(!username) return alert("Wpisz login użytkownika!");

        try {
            const res = await fetch(`${API_URL}/god/force-add-member`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token 
                },
                body: JSON.stringify({ code, username, role })
            });
            const data = await res.json();
            alert(data.message);
            if(res.ok) loadAll();
        } catch(e) { alert("Błąd połączenia!"); }
    }

    async function promoteUser(username) {
        if (!confirm(`Czy na pewno chcesz awansować użytkownika ${username} na wyższy poziom?`)) return;

        try {
            const res = await fetch(`${API_URL}/promote-global`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token 
                },
                body: JSON.stringify({ targetUsername: username })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAll();
        } catch(e) { alert("Błąd serwera przy awansie!"); }
    }

    async function demoteUser(username) {
        if (!confirm(`UWAGA! Czy na pewno chcesz ZDEGRADOWAĆ użytkownika ${username} na niższy poziom?`)) return;

        try {
            const res = await fetch(`${API_URL}/demote-global`, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token 
                },
                body: JSON.stringify({ targetUsername: username })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) {
                loadAll();
            }
        } catch(e) { 
            alert("Błąd połączenia z serwerem podczas odbierania rangi!"); 
        }
    }

    window.onload = loadAll;
</script>

</body>
</html>
