<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pheme - Panel Sigmy</title>
    <style>
        :root {
            --primary-green: #00ce52;
            --bg-gray: #f5f5f5;
            --dark-gray: #333333;
            --red-header: #ff3b3b;
            --gold-boga: #ffaa00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-bar {
            width: 100%;
            background: linear-gradient(to right, #ffd700, var(--gold-boga));
            color: #000;
            text-align: center;
            padding: 15px 0;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin-top: 30px;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active { background: var(--gold-boga); color: #000; }

        .content-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            min-height: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .item-box {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid var(--gold-boga);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .god-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
        }

        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button.god-action {
            background: var(--dark-gray);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button.god-action:hover { background: var(--gold-boga); color: black; }
        
        .badge {
            background: #ddd;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .badge-new {
            background: #ff3b3b;
            color: white;
        }

        .badge-edited {
            background: #ff9800;
            color: white;
        }

        .badge-count {
            background: #ff3b3b;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8rem;
        }

        .back-link { margin-top: 20px; display: block; color: #888; text-decoration: none; text-align: center; }

        .header-with-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="header-bar">Panel Boga</div>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'sekcje')">Wszystkie Sekcje</button>
        <button class="tab-btn" onclick="openTab(event, 'uzytkownicy')">Użytkownicy</button>
        <button class="tab-btn" id="tab-btn-pytania" onclick="openTab(event, 'pytania')">Pytania / Konwersacje</button>
        <button class="tab-btn" id="tab-btn-feedback" onclick="openTab(event, 'feedback')">Ostatnie Feedbacki</button>
    </div>

    <div class="content-card">
        <div id="sekcje" class="tab-content active">
            <h2>Zarządzanie Sekcjami</h2>
            <div id="sekcje-list">Ładowanie...</div>
        </div>

        <div id="uzytkownicy" class="tab-content">
            <h2>Wszyscy Zarejestrowani Użytkownicy</h2>
            <div id="users-list">Ładowanie...</div>
        </div>

        <div id="pytania" class="tab-content">
            <div class="header-with-action">
                <h2 id="q-header" style="margin:0;">Globalny podgląd konwersacji</h2>
                <button class="god-action" onclick="markQuestionsRead()">✔ Oznacz wszystkie jako przeczytane</button>
            </div>
            <div id="questions-list">Ładowanie...</div>
        </div>

        <div id="feedback" class="tab-content">
            <div class="header-with-action">
                <h2 id="f-header" style="margin:0;">Globalny podgląd opinii</h2>
                <button class="god-action" onclick="markFeedbacksRead()">✔ Oznacz wszystkie jako przeczytane</button>
            </div>
            <div id="feedbacks-list">Ładowanie...</div>
        </div>
    </div>

    <a href="start.html" class="back-link">← Powrót do normalności (Kondescendencja) </a>
</div>

<script>
    const API_URL = "https://pheme-far9.onrender.com";
    const token = localStorage.getItem("token");

    let currentUsername = "";
    
    // Zmienne globalne przechowujące tablice ułatwiające odświeżanie
    let globalQuestions = [];
    let globalFeedbacks = [];

    if (!token) window.location.href = "index.html";

    function openTab(evt, tabName) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    async function fetchData(endpoint) {
        const res = await fetch(`${API_URL}/god/${endpoint}`, {
            headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) {
            if (res.status === 403) alert("Brak uprawnień boskich!");
            return null;
        }
        return await res.json();
    }

    // 🕒 Funkcja pomocnicza: Zamienia polską datę (DD.MM.YYYY, HH:mm:ss) na timestamp (czas w milisekundach), co ułatwia sortowanie
    function parseDateToTs(dateStr) {
        if (!dateStr) return 0;
        try {
            dateStr = dateStr.replace(/\u202F/g, ' '); 
            const parts = dateStr.split(', ');
            if (parts.length !== 2) return new Date(dateStr).getTime() || 0;
            const [d, m, y] = parts[0].split('.');
            const [hr, min, sec] = parts[1].split(':');
            return new Date(y, m - 1, d, hr, min, sec).getTime();
        } catch (e) {
            return 0;
        }
    }

    async function loadAll() {
        if (!currentUsername) {
            try {
                const profileRes = await fetch(`${API_URL}/profil`, { headers: { "Authorization": "Bearer " + token } });
                if (profileRes.ok) currentUsername = (await profileRes.json()).username;
            } catch (e) { console.error("Nie udało się pobrać tożsamości", e); }
        }

        const users = await fetchData("all-users");
        const sections = await fetchData("all-sections");
        const questions = await fetchData("all-questions");
        const feedbacks = await fetchData("all-feedbacks");

        if(users) renderUsers(users);
        if(sections) renderSections(sections);
        
        if(questions) {
            globalQuestions = questions;
            renderQuestions(globalQuestions);
        }
        if(feedbacks) {
            globalFeedbacks = feedbacks;
            renderFeedbacks(globalFeedbacks);
        }
    }

    // 🔥 Funkcja czyszcząca powiadomienia Pytań
    function markQuestionsRead() {
        localStorage.setItem('god_seen_questions', Date.now());
        renderQuestions(globalQuestions);
    }

    // 🔥 Funkcja czyszcząca powiadomienia Feedbacków
    function markFeedbacksRead() {
        localStorage.setItem('god_seen_feedbacks', Date.now());
        renderFeedbacks(globalFeedbacks);
    }

    function renderUsers(users) {
        document.getElementById("users-list").innerHTML = users.map(u => `
            <div class="item-box" style="display:flex; justify-content:space-between; align-items:center;">
                <span><strong>${u.username}</strong> (${u.name || 'Brak imienia'})</span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="badge" style="background:${u.role === 'polska_sigma' ? '#ffaa00' : (u.role === 'admin' ? '#ff3b3b' : '#eee')}; color:${u.role !== 'user' ? '#fff' : '#333'}">${u.role}</span>
                    ${u.role !== 'polska_sigma' ? `<button class="god-action" style="padding: 4px 10px; font-size: 0.8rem;" onclick="promoteUser('${u.username}')">Awansuj ↑</button>` : ''}
                    ${currentUsername === "pomaksik" && u.username !== "pomaksik" && u.role !== "user" ? `<button class="god-action" style="padding: 4px 10px; font-size: 0.8rem; background: #ff00cc;" onclick="demoteUser('${u.username}')">Degraduj ↓</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function renderSections(sections) {
        document.getElementById("sekcje-list").innerHTML = sections.map(s => `
            <div class="item-box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3 style="margin:0">${s.name} <span class="badge">Kod: ${s.code}</span></h3>
                    <small>Założyciel: ${s.creator}</small>
                </div>
                <div style="margin-top:10px; font-size: 0.9rem;">
                    <strong>Członkowie (${s.members.length}):</strong> 
                    ${s.members.map(m => `${m.username} <small>(${m.role})</small>`).join(', ')}
                </div>
                <div class="god-form" style="display:flex; flex-wrap:wrap; justify-content:space-between;">
                    <div style="display:flex; gap:10px; align-items:center;">
                        <strong>Wymuś dodanie:</strong>
                        <input type="text" id="add-user-${s.code}" placeholder="Login (username)">
                        <select id="add-role-${s.code}">
                            <option value="user">Uczeń</option>
                            <option value="nauczyciel">Nauczyciel</option>
                        </select>
                        <button class="god-action" onclick="forceAddMember('${s.code}')">Dodaj</button>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="god-action" style="background: var(--gold-boga); color: black;" onclick="window.location.href='widok-sekcji.html?kod=${s.code}'">👁️ Wejdź do sekcji</button>
                        <button class="god-action" style="background: #ff3b3b; color: white;" onclick="usunCalaSekcje('${s.code}')">🗑️ Usuń całą sekcję</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Dodaj to zaraz pod renderSections
    async function usunCalaSekcje(code) {
        const input = prompt(`UWAGA! Zmierzasz zniszczyć całą sekcję ze wszystkimi wiadomościami!\n\nPrzepisz kod sekcji "${code}" aby potwierdzić niszczenie:`);
        
        if (input !== code) {
            if (input !== null) alert("Kod się nie zgadza. Anulowano niszczenie.");
            return;
        }

        try {
            const res = await fetch(`${API_URL}/god/delete-section/${code}`, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAll(); // Odświeżamy listę na żywo
        } catch(e) { alert("Błąd łączenia z serwerem podczas usuwania."); }
    }

    // 🔥 ZAKTUALIZOWANE RENDEROWANIE PYTAŃ: Sortowanie i weryfikacja daty "Ostatnio widziane"
    function renderQuestions(questions) {
        const lastSeen = parseInt(localStorage.getItem('god_seen_questions') || '0');
        
        // Obliczamy max aktywność (najnowsza data postu ATAKŻE każdej z odpowiedzi w nim zawartych)
        questions.forEach(q => {
            let maxTs = parseDateToTs(q.date);
            if (q.replies && q.replies.length > 0) {
                q.replies.forEach(r => {
                    const rTs = parseDateToTs(r.date);
                    if (rTs > maxTs) maxTs = rTs;
                });
            }
            q.lastActivityTs = maxTs;
        });

        // Sortujemy: najnowsza aktywność na samej górze
        questions.sort((a, b) => b.lastActivityTs - a.lastActivityTs);

        // Liczymy ile jest "nowych" (czyli takich których data ostatniej aktywności jest większa od daty wziętej z przycisku Oznacz Przeczytane)
        const newCount = questions.filter(q => q.lastActivityTs > lastSeen).length;

        // Aktualizujemy Nagłówek w Zakładce
        document.getElementById("q-header").innerHTML = `Globalny podgląd konwersacji ${newCount > 0 ? `<span style="color:#ff3b3b; font-size:1.2rem;">(${newCount} nowych)</span>` : ''}`;
        
        // Aktualizujemy Przycisk Zakładki
        const tabBtn = document.getElementById("tab-btn-pytania");
        tabBtn.innerHTML = `Pytania / Konwersacje ${newCount > 0 ? `<span class="badge-count">${newCount}</span>` : ''}`;

        document.getElementById("questions-list").innerHTML = questions.map(q => {
            const isNew = q.lastActivityTs > lastSeen;
            return `
                <div class="item-box" style="border-left-color: purple; ${isNew ? 'background-color: #fff4f4; border: 1px solid #ff3b3b;' : ''}">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <span class="badge">${q.sectionName}</span>
                            ${isNew ? '<span class="badge badge-new">NOWA AKTYWNOŚĆ</span>' : ''}
                        </div>
                        <small>${q.date}</small>
                    </div>
                    <h4 style="margin: 10px 0 5px 0;">Temat: ${q.subject}</h4>
                    <div style="font-size:0.9rem; margin-bottom: 5px;">
                        <strong>Od:</strong> ${q.from} | <strong>Do:</strong> ${q.to.join(', ')}
                    </div>
                    <p style="margin:0; background:white; padding:10px; border-radius:5px;">${q.text}</p>
                    <small style="color:#888;">Odpowiedzi: ${q.replies ? q.replies.length : 0}</small>
                </div>
            `;
        }).join('');
    }

    // 🔥 ZAKTUALIZOWANE RENDEROWANIE OPINII: Sortowanie i weryfikacja daty "Ostatnio widziane"
    function renderFeedbacks(feedbacks) {
        const lastSeen = parseInt(localStorage.getItem('god_seen_feedbacks') || '0');
        
        feedbacks.forEach(f => {
            f.lastActivityTs = parseDateToTs(f.date);
        });

        // Sortujemy
        feedbacks.sort((a, b) => b.lastActivityTs - a.lastActivityTs);

        const newCount = feedbacks.filter(f => f.lastActivityTs > lastSeen).length;

        // Aktualizujemy Nagłówek w Zakładce
        document.getElementById("f-header").innerHTML = `Globalny podgląd opinii ${newCount > 0 ? `<span style="color:#ff3b3b; font-size:1.2rem;">(${newCount} nowych)</span>` : ''}`;
        
        // Aktualizujemy Przycisk Zakładki
        const tabBtn = document.getElementById("tab-btn-feedback");
        tabBtn.innerHTML = `Ostatnie Feedbacki ${newCount > 0 ? `<span class="badge-count">${newCount}</span>` : ''}`;

        document.getElementById("feedbacks-list").innerHTML = feedbacks.map(f => {
            const isNew = f.lastActivityTs > lastSeen;
            return `
                <div class="item-box" style="border-left-color: #007bff; ${isNew ? 'background-color: #eef7ff; border: 1px solid #007bff;' : ''}">
                    <div style="display:flex; justify-content:space-between;">
                        <div>
                            <span class="badge">${f.sectionName} - ${f.lessonName}</span>
                            ${isNew && !f.edited ? '<span class="badge badge-new">NOWE</span>' : ''}
                            ${isNew && f.edited ? '<span class="badge badge-edited">EDYTOWANE</span>' : ''}
                        </div>
                        <small>${f.date}</small>
                    </div>
                    <div style="margin-top: 10px; font-size:0.9rem;">
                        <strong>Autor:</strong> ${f.author || f.username} ${f.edited ? '<small style="color:#ff9800; font-weight:bold;">(edytowano)</small>' : ''}
                    </div>
                    <p style="margin:5px 0 0 0; background:white; padding:10px; border-radius:5px; white-space:pre-wrap;">${f.message}</p>
                </div>
            `;
        }).join('');
    }

    async function forceAddMember(code) {
        const username = document.getElementById(`add-user-${code}`).value.trim();
        const role = document.getElementById(`add-role-${code}`).value;
        if(!username) return alert("Wpisz login użytkownika!");
        try {
            const res = await fetch(`${API_URL}/god/force-add-member`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ code, username, role })
            });
            const data = await res.json();
            alert(data.message);
            if(res.ok) loadAll();
        } catch(e) { alert("Błąd połączenia!"); }
    }

    async function promoteUser(username) {
        if (!confirm(`Czy na pewno chcesz awansować użytkownika ${username}?`)) return;
        try {
            const res = await fetch(`${API_URL}/promote-global`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ targetUsername: username })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAll();
        } catch(e) { alert("Błąd serwera przy awansie!"); }
    }

    async function demoteUser(username) {
        if (!confirm(`UWAGA! Czy na pewno chcesz ZDEGRADOWAĆ użytkownika ${username}?`)) return;
        try {
            const res = await fetch(`${API_URL}/demote-global`, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
                body: JSON.stringify({ targetUsername: username })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) loadAll();
        } catch(e) { alert("Błąd odbierania rangi!"); }
    }

    window.onload = loadAll;
</script>

</body>
</html>
